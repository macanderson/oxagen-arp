<svg xmlns="http://www.w3.org/2000/svg" id="arp-reporting" class="arp-diagram" viewBox="0 0 1200 1100" role="img" aria-labelledby="arp-reporting-title arp-reporting-desc">
<title id="arp-reporting-title">Required reports link back to the work</title><desc id="arp-reporting-desc">The trusted run guard supplies the approved persona ID and name, run identity, and per-tool call counts. Version-control and pull-request connectors supply repository and workspace identity, the configured default branch and its exact base revision, the working branch and head commit, the changed-file list and diff, and any pull-request number and link. CI connectors supply every job status with the commit it checked. The protected local gateway scans report text, files, and references before any upload. Only cleaned report data is persisted through the tenant-selected data service into the same record store and file references used by the Oxagen web app. That data service may be SaaS or customer-private. It checks access to each record when writing and reading. The web app shows observation time, freshness, and field status. No PR, unknown PR state, missing or redacted data, running jobs, and failed jobs stay distinct. An old commit’s CI result does not prove the current head passed. Every required field has a value or an explicit status. A model summary does not replace these trusted records.</desc>
<defs><marker id="arp-reporting-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="var(--diagram-line,var(--arp-line,#A1A1AA))" stroke-width="1.5" stroke-linejoin="round"/></marker></defs>
<style>
#arp-reporting{--arp-bg:#09090B;--arp-panel:#18181B;--arp-text:#FFFFFF;--arp-muted:#A1A1AA;--arp-line:#A1A1AA}
@media(prefers-color-scheme:light){#arp-reporting{--arp-bg:#FFFFFF;--arp-panel:#FFFFFF;--arp-text:#09090B;--arp-muted:#71717A;--arp-line:#71717A}}
#arp-reporting .box{fill:var(--diagram-panel,var(--arp-panel,#18181B));stroke:var(--diagram-line,var(--arp-line,#A1A1AA));stroke-width:2}
#arp-reporting .inner{fill:none;stroke:var(--diagram-line,var(--arp-line,#A1A1AA));stroke-width:1.5}
#arp-reporting .edge{fill:none;stroke:var(--diagram-line,var(--arp-line,#A1A1AA));stroke-width:2;stroke-linejoin:round;marker-end:url(#arp-reporting-arrow)}
#arp-reporting .title{font-family:"Space Grotesk",sans-serif;font-size:32px;font-weight:600;fill:var(--diagram-text,var(--arp-text,#FFFFFF))}
#arp-reporting .label{font-family:Geist,sans-serif;font-size:24px;font-weight:600;fill:var(--diagram-text,var(--arp-text,#FFFFFF))}
#arp-reporting .body{font-family:Geist,sans-serif;font-size:22px;font-weight:400;fill:var(--diagram-muted,var(--arp-muted,#A1A1AA))}
#arp-reporting .note{font-family:Geist,sans-serif;font-size:20px;font-weight:400;fill:var(--diagram-muted,var(--arp-muted,#A1A1AA))}
#arp-reporting .number{font-family:"Monaspace Neon",monospace;font-size:26px;font-weight:500;fill:var(--diagram-text,var(--arp-text,#FFFFFF))}
</style>
<rect width="1200" height="1100" fill="var(--diagram-bg,var(--arp-bg,#09090B))"/>

