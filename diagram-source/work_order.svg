<svg xmlns="http://www.w3.org/2000/svg" id="arp-work_order" class="arp-diagram" viewBox="0 0 1200 1080" role="img" aria-labelledby="arp-work_order-title arp-work_order-desc">
<title id="arp-work_order-title">A work order sets the task. Each call still gets checked.</title><desc id="arp-work_order-desc">A versioned work order assigns a task to an agent and records its owner and fixed revision. Reusable policies and the agent’s Permissions &amp; limits separately govern access, tools, context, and shared budget limits. A work order cannot grant rights beyond the agent definition or workspace. Every proposed model, tool, or data call is checked against current identity and record access, policy, approval requirements, and the shared budget. Outgoing data is cleaned locally before remote disclosure, and checks bind the final cleaned request. Oxagen saves the decision and reserves the bounded cost. The resulting governed action is one exact checked call. Its internal one-use authorization binds the exact request, caller, run, current authority, and expiry. The protected gate rechecks current access and uses that authorization once. Changed inputs or reuse are denied. Oxagen records the order version, action ID, cleaned request and output, usage, cost, and outcome. Uncertain remote results remain explicit and need reconciliation before an unsafe retry. One-use internal authorization does not make a remote system exactly once. Human approval is needed only when current policy requires it.</desc>
<defs><marker id="arp-work_order-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="var(--diagram-line,var(--arp-line,#A1A1AA))" stroke-width="1.5" stroke-linejoin="round"/></marker></defs>
<style>
#arp-work_order{--arp-bg:#09090B;--arp-panel:#18181B;--arp-text:#FFFFFF;--arp-muted:#A1A1AA;--arp-line:#A1A1AA}
@media(prefers-color-scheme:light){#arp-work_order{--arp-bg:#FFFFFF;--arp-panel:#FFFFFF;--arp-text:#09090B;--arp-muted:#71717A;--arp-line:#71717A}}
#arp-work_order .box{fill:var(--diagram-panel,var(--arp-panel,#18181B));stroke:var(--diagram-line,var(--arp-line,#A1A1AA));stroke-width:2}
#arp-work_order .inner{fill:none;stroke:var(--diagram-line,var(--arp-line,#A1A1AA));stroke-width:1.5}
#arp-work_order .edge{fill:none;stroke:var(--diagram-line,var(--arp-line,#A1A1AA));stroke-width:2;stroke-linejoin:round;marker-end:url(#arp-work_order-arrow)}
#arp-work_order .title{font-family:"Space Grotesk",sans-serif;font-size:32px;font-weight:600;fill:var(--diagram-text,var(--arp-text,#FFFFFF))}
#arp-work_order .label{font-family:Geist,sans-serif;font-size:24px;font-weight:600;fill:var(--diagram-text,var(--arp-text,#FFFFFF))}
#arp-work_order .body{font-family:Geist,sans-serif;font-size:22px;font-weight:400;fill:var(--diagram-muted,var(--arp-muted,#A1A1AA))}
#arp-work_order .note{font-family:Geist,sans-serif;font-size:20px;font-weight:400;fill:var(--diagram-muted,var(--arp-muted,#A1A1AA))}
#arp-work_order .number{font-family:"Monaspace Neon",monospace;font-size:26px;font-weight:500;fill:var(--diagram-text,var(--arp-text,#FFFFFF))}
</style>
<rect width="1200" height="1080" fill="var(--diagram-bg,var(--arp-bg,#09090B))"/>

<text x="40" y="52" class="title" text-anchor="start">A work order sets the task. Each call still gets checked.</text>
