<text x="64" y="164" class="label" text-anchor="start">Versioned work order</text>
<text x="64" y="201" class="body" text-anchor="start">Task and assigned agent</text>
<text x="64" y="231" class="body" text-anchor="start">Scope of the requested work</text>
<text x="64" y="261" class="body" text-anchor="start">Owner + fixed version</text>
<text x="64" y="291" class="body" text-anchor="start">No new access rights</text>
<rect x="660" y="125" width="500" height="230" rx="12" class="box"/>
<text x="684" y="164" class="label" text-anchor="start">Policies + Permissions &amp; limits</text>
<text x="684" y="201" class="body" text-anchor="start">Reusable rules govern this work.</text>
<text x="684" y="231" class="body" text-anchor="start">Agent and workspace rights set limits.</text>
<text x="684" y="261" class="body" text-anchor="start">Tools, context, and shared budgets</text>
<text x="684" y="291" class="body" text-anchor="start">All current checks must pass.</text>
<rect x="40" y="445" width="310" height="185" rx="12" class="box"/>
<text x="64" y="484" class="label" text-anchor="start">Proposed call</text>
<text x="64" y="521" class="body" text-anchor="start">Tool, model, or data</text>
<text x="64" y="551" class="body" text-anchor="start">Cleaned inputs + target</text>
<text x="64" y="581" class="body" text-anchor="start">Current run identity</text>
<rect x="430" y="445" width="350" height="185" rx="12" class="box"/>
<text x="454" y="484" class="label" text-anchor="start">Check this call now</text>
<text x="454" y="521" class="body" text-anchor="start">Identity + record rights</text>
<text x="454" y="551" class="body" text-anchor="start">Current policy + approval</text>
<text x="454" y="581" class="body" text-anchor="start">Reserve the shared budget</text>
<text x="454" y="611" class="body" text-anchor="start">Save the decision</text>
<rect x="860" y="445" width="300" height="185" rx="12" class="box"/>
<text x="884" y="484" class="label" text-anchor="start">Governed action</text>
<text x="884" y="521" class="body" text-anchor="start">Exact checked request</text>
<text x="884" y="551" class="body" text-anchor="start">Caller + run + time limit</text>
<text x="884" y="581" class="body" text-anchor="start">One internal approval</text>
<path d="M 240 355 V 395 H 195 V 445" class="edge"/>
<path d="M 910 355 V 395 H 605 V 445" class="edge"/>
<path d="M 350 537 H 430" class="edge"/>
<path d="M 780 537 H 860" class="edge"/>
<rect x="860" y="745" width="300" height="135" rx="12" class="box"/>
<text x="884" y="784" class="label" text-anchor="start">Gate checks and runs</text>
<text x="884" y="821" class="body" text-anchor="start">Recheck current access.</text>
<text x="884" y="851" class="body" text-anchor="start">Use approval only once.</text>
<path d="M 1010 630 V 745" class="edge"/>
<rect x="40" y="745" width="680" height="155" rx="12" class="box"/>
<text x="64" y="784" class="label" text-anchor="start">Record the action and result</text>
<text x="64" y="821" class="body" text-anchor="start">Keep the work order, action ID, and cleaned request.</text>
<text x="64" y="851" class="body" text-anchor="start">Keep cleaned output, usage, cost, and outcome.</text>
<text x="64" y="881" class="body" text-anchor="start">Mark missing results or unknown charges.</text>
<path d="M 860 812 H 720" class="edge"/>
<text x="40" y="969" class="note" text-anchor="start">Each action must stay within current agent and workspace rights.</text>
<text x="40" y="1005" class="note" text-anchor="start">A rule can allow the request. A person is asked only when the rule requires it.</text>
<text x="40" y="1041" class="note" text-anchor="start">A governed action is one exact checked call. It stays within current rights.</text>
</svg>