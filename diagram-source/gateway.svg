<text x="854" y="164" class="label" text-anchor="start">Harness or custom agent</text>
<text x="854" y="201" class="body" text-anchor="start">Codex, Claude Code,</text>
<text x="854" y="231" class="body" text-anchor="start">or a custom SDK client</text>
