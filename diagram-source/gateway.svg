<svg xmlns="http://www.w3.org/2000/svg" id="arp-gateway" class="arp-diagram" viewBox="0 0 1200 1140" role="img" aria-labelledby="arp-gateway-title arp-gateway-desc">
<title id="arp-gateway-title">Model requests must pass through Oxagen</title><desc id="arp-gateway-desc">Oxagen prepares allowed run context and steering. A harness adapter or custom SDK puts them into the next supported step. Hooks report events and help with steering, but are not the security boundary. The harness sends model, tool, and context requests through a protected desktop gateway outside the agent process and separate from the app UI. The local gateway scans the full assembled request, history, tool data, and attachments under workspace rules. It blocks, redacts, or replaces sensitive content before remote egress and blocks a send if required content cannot be checked. It also prevents direct network and credential bypass. Only cleaned requests reach the tenant model proxy, which authorizes each call, holds provider keys, and sends approved requests to models. Each tenant gate checks the ScanReceipt that binds the exact cleaned request to the current workspace scan policy. A missing, stale, or mismatched receipt blocks the request. Remote tool and context gates also check operations and record rights. Only cleaned evidence enters Oxagen records. Strict mode refuses any required route that cannot be guarded or disabled. A removable hook alone cannot stop bypass.</desc>
<defs><marker id="arp-gateway-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="var(--diagram-line,var(--arp-line,#A1A1AA))" stroke-width="1.5" stroke-linejoin="round"/></marker></defs>
<style>
#arp-gateway{--arp-bg:#09090B;--arp-panel:#18181B;--arp-text:#FFFFFF;--arp-muted:#A1A1AA;--arp-line:#A1A1AA}
@media(prefers-color-scheme:light){#arp-gateway{--arp-bg:#FFFFFF;--arp-panel:#FFFFFF;--arp-text:#09090B;--arp-muted:#71717A;--arp-line:#71717A}}
#arp-gateway .box{fill:var(--diagram-panel,var(--arp-panel,#18181B));stroke:var(--diagram-line,var(--arp-line,#A1A1AA));stroke-width:2}
#arp-gateway .inner{fill:none;stroke:var(--diagram-line,var(--arp-line,#A1A1AA));stroke-width:1.5}
#arp-gateway .edge{fill:none;stroke:var(--diagram-line,var(--arp-line,#A1A1AA));stroke-width:2;stroke-linejoin:round;marker-end:url(#arp-gateway-arrow)}
#arp-gateway .title{font-family:"Space Grotesk",sans-serif;font-size:32px;font-weight:600;fill:var(--diagram-text,var(--arp-text,#FFFFFF))}
#arp-gateway .label{font-family:Geist,sans-serif;font-size:24px;font-weight:600;fill:var(--diagram-text,var(--arp-text,#FFFFFF))}
#arp-gateway .body{font-family:Geist,sans-serif;font-size:22px;font-weight:400;fill:var(--diagram-muted,var(--arp-muted,#A1A1AA))}
#arp-gateway .note{font-family:Geist,sans-serif;font-size:20px;font-weight:400;fill:var(--diagram-muted,var(--arp-muted,#A1A1AA))}
#arp-gateway .number{font-family:"Monaspace Neon",monospace;font-size:26px;font-weight:500;fill:var(--diagram-text,var(--arp-text,#FFFFFF))}
</style>
<rect width="1200" height="1140" fill="var(--diagram-bg,var(--arp-bg,#09090B))"/>

