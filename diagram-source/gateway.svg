<text x="40" y="1090" class="note" text-anchor="start">Tenant gates check the scan receipt before forwarding a cleaned request.</text>
<text x="40" y="1126" class="note" text-anchor="start">If a required route cannot be guarded or disabled, strict mode refuses the run.</text>
</svg>