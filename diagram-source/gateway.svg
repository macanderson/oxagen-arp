<path d="M 600 640 V 680" class="edge"/>
<path d="M 600 640 H 995 V 680" class="edge"/>
<text x="625" y="620" class="note" text-anchor="start">Only cleaned requests leave</text>
<rect x="40" y="935" width="330" height="105" rx="12" class="box"/>
<text x="64" y="974" class="label" text-anchor="start">Approved model</text>
<text x="64" y="1011" class="body" text-anchor="start">Only the approved route.</text>
<rect x="435" y="935" width="330" height="105" rx="12" class="box"/>
<text x="459" y="974" class="label" text-anchor="start">Allowed tool routes</text>
<text x="459" y="1011" class="body" text-anchor="start">Native or remote effects</text>
<rect x="830" y="935" width="330" height="105" rx="12" class="box"/>
<text x="854" y="974" class="label" text-anchor="start">Allowed data sources</text>
