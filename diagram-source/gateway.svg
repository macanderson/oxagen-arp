<text x="384" y="459" class="label" text-anchor="start">Protected local desktop gateway</text>
<text x="384" y="496" class="body" text-anchor="start">Separate from the app UI.</text>
<text x="384" y="526" class="body" text-anchor="start">Scan the full outgoing request.</text>
<text x="384" y="556" class="body" text-anchor="start">Block bypass routes and keys.</text>
