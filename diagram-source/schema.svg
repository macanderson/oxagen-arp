<text x="40" y="1318" class="note" text-anchor="start">Files and projections do not create new authority. They use the same record rights.</text>
<text x="40" y="1354" class="note" text-anchor="start">The graph foundation is required. Business ingestion and partner plugins remain future work.</text>
</svg>