<svg xmlns="http://www.w3.org/2000/svg" id="arp-schema" class="arp-diagram" viewBox="0 0 1200 1370" role="img" aria-labelledby="arp-schema-title arp-schema-desc">
<title id="arp-schema-title">One set of records, with checked views of the same work</title><desc id="arp-schema-desc">Tenant, workspace, and canonical IAM records identify people and agents and hold per-record permissions. Runs and governed actions reference these identities. Policy decisions and shared limits reference the exact action. These primary PostgreSQL records use tenant and workspace row-level security plus canonical record grants. Sanitized evidence and a transactional outbox are saved with the work. Large clean evidence files live in a separate encrypted object store through checked references; object storage is not a competing authority or an escape from record access. Outbox workers build graph and search projections from committed records. Source systems such as version control and business services keep authority over their own facts. Checked source bindings retain stable IDs, native versions, permissions, and cleaned data. These also feed the required context graph. A future business ingestion block joins the shared trusted connector receipt to external business records using exact source IDs and versions. The future join never uses a model guess or a fuzzy amount match. Every graph edge and search result still receives record access checks. This drawing groups schema domains rather than depicting each physical table.</desc>
<defs><marker id="arp-schema-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="var(--diagram-line,var(--arp-line,#A1A1AA))" stroke-width="1.5" stroke-linejoin="round"/></marker></defs>
<style>
#arp-schema{--arp-bg:#09090B;--arp-panel:#18181B;--arp-text:#FFFFFF;--arp-muted:#A1A1AA;--arp-line:#A1A1AA}
@media(prefers-color-scheme:light){#arp-schema{--arp-bg:#FFFFFF;--arp-panel:#FFFFFF;--arp-text:#09090B;--arp-muted:#71717A;--arp-line:#71717A}}
#arp-schema .box{fill:var(--diagram-panel,var(--arp-panel,#18181B));stroke:var(--diagram-line,var(--arp-line,#A1A1AA));stroke-width:2}
#arp-schema .inner{fill:none;stroke:var(--diagram-line,var(--arp-line,#A1A1AA));stroke-width:1.5}
#arp-schema .edge{fill:none;stroke:var(--diagram-line,var(--arp-line,#A1A1AA));stroke-width:2;stroke-linejoin:round;marker-end:url(#arp-schema-arrow)}
#arp-schema .title{font-family:"Space Grotesk",sans-serif;font-size:32px;font-weight:600;fill:var(--diagram-text,var(--arp-text,#FFFFFF))}
#arp-schema .label{font-family:Geist,sans-serif;font-size:24px;font-weight:600;fill:var(--diagram-text,var(--arp-text,#FFFFFF))}
#arp-schema .body{font-family:Geist,sans-serif;font-size:22px;font-weight:400;fill:var(--diagram-muted,var(--arp-muted,#A1A1AA))}
#arp-schema .note{font-family:Geist,sans-serif;font-size:20px;font-weight:400;fill:var(--diagram-muted,var(--arp-muted,#A1A1AA))}
#arp-schema .number{font-family:"Monaspace Neon",monospace;font-size:26px;font-weight:500;fill:var(--diagram-text,var(--arp-text,#FFFFFF))}
</style>
<rect width="1200" height="1370" fill="var(--diagram-bg,var(--arp-bg,#09090B))"/>

