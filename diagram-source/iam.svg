<svg xmlns="http://www.w3.org/2000/svg" id="arp-iam" class="arp-diagram" viewBox="0 0 1200 1170" role="img" aria-labelledby="arp-iam-title arp-iam-desc">
<title id="arp-iam-title">People and agents use the same access checks</title><desc id="arp-iam-desc">Human and agent identities are first-class principals in the same canonical IAM and RBAC system. They have distinct identities, roles, and record grants; an agent also has an accountable operator. One authorization service composes identity, role and record rights, workspace scope, and current policy into an allow, deny, or approval-required decision. A person is asked only when the rule requires it. Only allowed requests may proceed through tool, context, model, and web or API gates. Data queries also enforce org and workspace boundaries through SQL row-level security where SQL is used. Application-level record checks still apply. Object and file stores, search indexes, and their gateways separately enforce org and per-record rights. SQL row-level security does not cover non-SQL stores by itself.</desc>
<defs><marker id="arp-iam-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="var(--diagram-line,var(--arp-line,#A1A1AA))" stroke-width="1.5" stroke-linejoin="round"/></marker></defs>
<style>
#arp-iam{--arp-bg:#09090B;--arp-panel:#18181B;--arp-text:#FFFFFF;--arp-muted:#A1A1AA;--arp-line:#A1A1AA}
@media(prefers-color-scheme:light){#arp-iam{--arp-bg:#FFFFFF;--arp-panel:#FFFFFF;--arp-text:#09090B;--arp-muted:#71717A;--arp-line:#71717A}}
#arp-iam .box{fill:var(--diagram-panel,var(--arp-panel,#18181B));stroke:var(--diagram-line,var(--arp-line,#A1A1AA));stroke-width:2}
#arp-iam .inner{fill:none;stroke:var(--diagram-line,var(--arp-line,#A1A1AA));stroke-width:1.5}
#arp-iam .edge{fill:none;stroke:var(--diagram-line,var(--arp-line,#A1A1AA));stroke-width:2;stroke-linejoin:round;marker-end:url(#arp-iam-arrow)}
#arp-iam .title{font-family:"Space Grotesk",sans-serif;font-size:32px;font-weight:600;fill:var(--diagram-text,var(--arp-text,#FFFFFF))}
#arp-iam .label{font-family:Geist,sans-serif;font-size:24px;font-weight:600;fill:var(--diagram-text,var(--arp-text,#FFFFFF))}
#arp-iam .body{font-family:Geist,sans-serif;font-size:22px;font-weight:400;fill:var(--diagram-muted,var(--arp-muted,#A1A1AA))}
#arp-iam .note{font-family:Geist,sans-serif;font-size:20px;font-weight:400;fill:var(--diagram-muted,var(--arp-muted,#A1A1AA))}
#arp-iam .number{font-family:"Monaspace Neon",monospace;font-size:26px;font-weight:500;fill:var(--diagram-text,var(--arp-text,#FFFFFF))}
</style>
<rect width="1200" height="1170" fill="var(--diagram-bg,var(--arp-bg,#09090B))"/>

<text x="40" y="52" class="title" text-anchor="start">People and agents use the same access checks</text>
<rect x="80" y="115" width="420" height="125" rx="12" class="box"/>
<text x="104" y="154" class="label" text-anchor="start">Human identity</text>
<text x="104" y="191" class="body" text-anchor="start">Own roles and record rights</text>
<text x="104" y="221" class="body" text-anchor="start">Organization + workspace</text>
<rect x="700" y="115" width="420" height="125" rx="12" class="box"/>
<text x="724" y="154" class="label" text-anchor="start">Agent identity</text>
<text x="724" y="191" class="body" text-anchor="start">Own ID + accountable operator</text>
<text x="724" y="221" class="body" text-anchor="start">Own roles and record rights</text>
<rect x="320" y="320" width="560" height="160" rx="12" class="box"/>
<text x="344" y="359" class="label" text-anchor="start">Shared identity and access service</text>
<text x="344" y="396" class="body" text-anchor="start">Who asks? Which record and action?</text>
<text x="344" y="426" class="body" text-anchor="start">Check roles, record grants, and policy.</text>
<text x="344" y="456" class="body" text-anchor="start">Use the right org and workspace.</text>
<path d="M 290 240 V 280 H 600 V 320" class="edge"/>
<path d="M 910 240 V 280 H 600" class="edge"/>
<rect x="350" y="545" width="500" height="120" rx="12" class="box"/>
<text x="374" y="584" class="label" text-anchor="start">One decision for this request</text>
<text x="374" y="621" class="body" text-anchor="start">Allow, deny, or ask if a rule requires it.</text>
<path d="M 600 480 V 545" class="edge"/>
<text x="625" y="706" class="note" text-anchor="start">Only allowed requests proceed</text>
<rect x="40" y="760" width="250" height="85" rx="12" class="box"/>
<text x="64" y="799" class="label" text-anchor="start">Tool gate</text>
<rect x="330" y="760" width="250" height="85" rx="12" class="box"/>
<text x="354" y="799" class="label" text-anchor="start">Context gate</text>
<rect x="620" y="760" width="250" height="85" rx="12" class="box"/>
<text x="644" y="799" class="label" text-anchor="start">Model gate</text>
<rect x="910" y="760" width="250" height="85" rx="12" class="box"/>
<text x="934" y="799" class="label" text-anchor="start">Web / API gate</text>
<path d="M 600 665 V 730 H 165 V 760" class="edge"/>
<path d="M 600 730 H 455 V 760" class="edge"/>
<path d="M 600 730 H 745 V 760" class="edge"/>
<path d="M 600 730 H 1035 V 760" class="edge"/>
<path d="M 165 845 V 875 H 1035 V 845 M 455 845 V 875 M 745 845 V 875" class="edge" style="marker-end:none"/>
<path d="M 600 875 V 935 H 300 V 975" class="edge"/>
<path d="M 600 935 H 900 V 975" class="edge"/>
<text x="625" y="916" class="note" text-anchor="start">Data reads and writes</text>
<rect x="40" y="975" width="520" height="135" rx="12" class="box"/>
<text x="64" y="1014" class="label" text-anchor="start">SQL row rules (RLS)</text>
<text x="64" y="1051" class="body" text-anchor="start">Scope rows to org + workspace.</text>
<text x="64" y="1081" class="body" text-anchor="start">The app still checks record access.</text>
<rect x="640" y="975" width="520" height="135" rx="12" class="box"/>
<text x="664" y="1014" class="label" text-anchor="start">Files, objects, and search</text>
<text x="664" y="1051" class="body" text-anchor="start">Check org and record rights.</text>
<text x="664" y="1081" class="body" text-anchor="start">SQL row rules do not cover these stores.</text>
<text x="40" y="1150" class="note" text-anchor="start">Shared checks do not mean shared rights. Each person and agent keeps its own allowed scope.</text>
</svg>